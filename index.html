<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#120c08" />
    <meta name="description" content="Shadowfolk: make hand shadows on a glowing lantern wall and watch them come alive." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2b45a'/%3E%3Cpath d='M10 22c2-6 2-11 4-14 1 3 0 6 1 8 1-3 3-6 5-7-1 4-1 8 2 13z' fill='%23140b05'/%3E%3C/svg%3E" />
    <title>Shadowfolk</title>
    <style>
      :root {
        --ink: #f6e7c8;
        --ink-dim: #c9b28a;
        --ember: #f2b45a;
        --night: #120c08;
      }
      html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); overflow: hidden; }
      body { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }
      #scene-container { position: fixed; inset: 0; }
      #intro {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: flex-end; padding: 0 16px 9vh; box-sizing: border-box; text-align: center;
        background: radial-gradient(ellipse at 50% 35%, transparent 0 35%, rgba(10, 6, 3, 0.75) 80%);
        transition: opacity 0.8s ease; pointer-events: none;
      }
      #intro.hidden { opacity: 0; }
      #intro > * { pointer-events: auto; }
      #intro h1 { font-size: clamp(2.2rem, 7vw, 4.2rem); margin: 0; letter-spacing: 0.08em; font-weight: 400; }
      #intro p { margin: 0.6rem 0 1.4rem; max-width: 32rem; color: var(--ink-dim); font-style: italic; line-height: 1.45; }
      #start {
        font: inherit; font-size: 1.15rem; padding: 0.85rem 2.2rem; border-radius: 999px; cursor: pointer;
        border: 1px solid rgba(242, 180, 90, 0.7); color: #1b1006; background: var(--ember);
        box-shadow: 0 0 32px rgba(242, 180, 90, 0.45);
      }
      #start:disabled { opacity: 0.6; cursor: default; }
      #modes { margin-top: 1rem; font-size: 0.9rem; color: var(--ink-dim); }
      #modes a { color: var(--ink); }
      #status { margin-top: 0.6rem; font-size: 0.85rem; color: var(--ink-dim); min-height: 1.2em; }
      #debug {
        position: fixed; top: 8px; left: 8px; font: 12px/1.35 ui-monospace, Menlo, monospace; white-space: pre;
        background: rgba(0, 0, 0, 0.62); color: #e9f3d8; padding: 8px 10px; border-radius: 6px; display: none;
        max-width: calc(100vw - 32px); overflow: hidden; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="intro">
      <h1>Shadowfolk</h1>
      <p>Sit comfortably. Raise your hands into the lantern light, make a shadow, and watch it come alive.</p>
      <button id="start" disabled>Waking the lantern…</button>
      <div id="modes">
        <a href="?demo=1">Watch the demo in your browser</a> · <a href="?debug=1">Debug mode</a>
      </div>
      <div id="status"></div>
    </div>
    <pre id="debug"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
